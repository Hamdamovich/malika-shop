<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Malika Print — Do'kon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- KATALOG -->
  <section id="view-catalog" class="view">
    <header class="top">
      <div class="brand">
        <div class="logo">MP</div>
        <div>
          <div class="shop-name" id="shop-name">Malika Print</div>
          <div class="shop-sub" id="shop-sub">Kanselyariya mahsulotlari</div>
        </div>
      </div>
      <input id="search" type="search" placeholder="🔍 Mahsulot qidirish..." autocomplete="off">
      <div id="chips" class="chips"></div>
    </header>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" hidden>Hech narsa topilmadi 🤷‍♂️</div>
  </section>

  <!-- SAVAT -->
  <section id="view-cart" class="view" hidden>
    <h2 class="title">Savat</h2>
    <div id="cart-list"></div>
    <div class="total-row"><span>Jami:</span><b id="cart-total">0 so'm</b></div>
    <button class="link-btn" id="clear-cart">Savatni tozalash</button>
  </section>

  <!-- RASMIYLASHTIRISH -->
  <section id="view-checkout" class="view" hidden>
    <h2 class="title">Buyurtmani rasmiylashtirish</h2>
    <form id="form" novalidate>
      <label>Ismingiz
        <input name="name" maxlength="64" required placeholder="Ism">
      </label>
      <label>Telefon raqam
        <input name="phone" type="tel" maxlength="20" required placeholder="+998 __ ___ __ __" value="+998 ">
      </label>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="delivery" value="delivery" checked> 🚚 Yetkazib berish</label>
        <label class="radio"><input type="radio" name="delivery" value="pickup"> 🏪 Do'kondan olib ketish</label>
      </div>
      <label id="address-wrap">Manzil
        <textarea name="address" rows="2" maxlength="200" placeholder="Ko'cha, uy, mo'ljal"></textarea>
      </label>
      <label>Izoh (ixtiyoriy)
        <textarea name="comment" rows="2" maxlength="200" placeholder="Masalan: soat 17:00 dan keyin"></textarea>
      </label>
      <div class="total-row"><span>To'lov (naqd, olganda):</span><b id="checkout-total">0 so'm</b></div>
      <div id="form-error" class="error" hidden></div>
    </form>
  </section>

  <!-- Telegramdan tashqarida (brauzerda test) ko'rinadigan tugma -->
  <button id="fallback-btn" class="fallback-btn" hidden></button>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
